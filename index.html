<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Task Management</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="topbar">
        <div>
            <h1>TaskFlow</h1>
            <p>Simple Task Management for Teams</p>
        </div>

        <button id="addTaskBtn">+ Add Task</button>
    </header>

    <main class="container">

        <!-- Statistics -->
        <section class="stats">
            <div class="stat-card">
                <span>Projects</span>
                <strong id="projectCount">0</strong>
            </div>

            <div class="stat-card">
                <span>Total Tasks</span>
                <strong id="taskCount">0</strong>
            </div>

            <div class="stat-card">
                <span>Completed</span>
                <strong id="completedCount">0</strong>
            </div>

            <div class="stat-card">
                <span>Pending</span>
                <strong id="pendingCount">0</strong>
            </div>
        </section>

        <!-- Quick Add -->
        <section class="quick-add">
            <h2>🤖 AI Quick-Add</h2>
            <p>Write your task in simple language.</p>

            <div class="quick-input">
                <input
                    type="text"
                    id="quickTask"
                    placeholder="Example: Complete homepage tomorrow, high priority"
                >
                <button id="quickAddBtn">Quick Add</button>
            </div>
        </section>

        <!-- Search and Sort -->
        <section class="tools">
            <input
                type="text"
                id="searchInput"
                placeholder="🔎 Search tasks..."
            >

            <select id="sortSelect">
                <option value="default">Sort Tasks</option>
                <option value="priority">Priority</option>
                <option value="date">Due Date</option>
                <option value="status">Status</option>
            </select>
        </section>

        <!-- Tasks -->
        <section class="tasks-section">
            <div class="section-title">
                <h2>My Tasks</h2>
                <span id="taskStatus">0 tasks</span>
            </div>

            <div id="taskList">
                <div class="empty-state">
                    <h3>No tasks yet</h3>
                    <p>Add your first task to get started.</p>
                </div>
            </div>
        </section>

    </main>

    <!-- Add Task Modal -->
    <div class="modal" id="taskModal">

        <div class="modal-content">

            <div class="modal-header">
                <h2>Add New Task</h2>
                <button id="closeModal">&times;</button>
            </div>

            <form id="taskForm">

                <label>Task Title</label>
                <input
                    type="text"
                    id="taskTitle"
                    placeholder="Enter task title"
                    required
                >

                <label>Project</label>
                <input
                    type="text"
                    id="taskProject"
                    placeholder="Example: Website Project"
                    required
                >

                <label>Priority</label>
                <select id="taskPriority">
                    <option value="Low">Low</option>
                    <option value="Medium" selected>Medium</option>
                    <option value="High">High</option>
                </select>

                <label>Due Date</label>
                <input type="date" id="taskDueDate">

                <button type="submit" class="save-btn">
                    Save Task
                </button>

            </form>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
